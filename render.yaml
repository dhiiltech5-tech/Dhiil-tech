services:
  # ─────────────────────────────────────────────
  # BACKEND — Flask / Gunicorn
  # ─────────────────────────────────────────────
  - type: web
    name: dhiiltech-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a strong random value
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_tMPB1r3DLayR@ep-tiny-pond-axoshw1m.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: FRONTEND_URL
        sync: false                  # Set to your Render static site URL after deploy

  # ─────────────────────────────────────────────
  # FRONTEND — React / Vite (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: dhiiltech-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                  # Set to your dhiiltech-backend Render URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html     # Enables React Router client-side routing
